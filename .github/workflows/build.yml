name: Build AKHIM AI APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # পুৰণি বেয়া pip ৰ ফাইলবোৰ মচিবলৈ Cache v6 কৰা হ'ল
      - name: Cache Buildozer files
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-v6-${{ hashFiles('buildozer.spec') }}

      - name: Install dependencies
        run: |
          sudo apt update
          # ইয়াত python3-venv টো যোগ কৰা হ'ল যাতে সি Ubuntu ৰ নিজা সুৰক্ষিত ছিষ্টেমটো ব্যৱহাৰ কৰে
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip python3-venv autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Setup Python Environment
        run: |
          # ইয়াত virtualenv টো একেবাৰে আঁতৰাই দিয়া হ'ল যাতে কোনো কাজিয়া নহয়
          python3 -m pip install --upgrade pip setuptools
          python3 -m pip install --upgrade Cython==0.29.33 buildozer

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AKHIM-AI-APK
          path: bin/*.apk
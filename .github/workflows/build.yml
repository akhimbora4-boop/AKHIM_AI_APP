name: Build AKHIM AI APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # মোৰ ভুলৰ বাবে সোমোৱা পুৰণি বেয়া ফাইলবোৰ মচিবলৈ ইয়াত Cache v5 কৰা হ'ল
      - name: Cache Buildozer files
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-v5-${{ hashFiles('buildozer.spec') }}

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Setup Python Environment
        run: |
          # মই আগতে দিয়া পুৰণি ভাৰ্চন আঁতৰাই একেবাৰে শেহতীয়া (Latest) ভাৰ্চন দিয়া হ'ল
          python3 -m pip install --upgrade pip setuptools virtualenv
          python3 -m pip install --upgrade Cython==0.29.33 buildozer

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AKHIM-AI-APK
          path: bin/*.apk
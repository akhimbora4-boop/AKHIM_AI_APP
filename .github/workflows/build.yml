name: Build AKHIM AI APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-android:
    # ইয়াত ubuntu-latest ৰ সলনি ubuntu-22.04 কৰা হ'ল যাতে libtinfo5 পেকেজটো বিচাৰি পায়
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        # ইয়াত v3 ৰ সলনি v4 কৰা হ'ল যাতে আগৰ Warning টো নাহে
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Clean Previous Caches (The Master Trick)
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          
      - name: Install Buildozer from Master Branch
        run: |
          pip install --upgrade Cython==0.29.33 virtualenv
          pip install git+https://github.com/kivy/buildozer.git@master

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AKHIM-AI-APK
          path: bin/*.apk

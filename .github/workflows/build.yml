name: Build AKHIM AI APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # পুৰণি সকলো বেয়া Cache আঁতৰাবলৈ v4 ব্যৱহাৰ কৰা হ'ল
      - name: Cache Buildozer files
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-v4-${{ hashFiles('buildozer.spec') }}

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Setup Python Environment (Fix for PIP Error)
        run: |
          # ইয়াত আমি pip আৰু virtualenv-ৰ নিৰ্দিষ্ট আৰু সুস্থিৰ ভাৰ্চন দিছোঁ যাতে open_rich_spinner ৰ error নাহে
          python3 -m pip install --upgrade pip==23.3.2 setuptools virtualenv==20.21.0
          python3 -m pip install --upgrade Cython==0.29.33 buildozer

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AKHIM-AI-APK
          path: bin/*.apk
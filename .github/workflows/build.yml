name: Build AKHIM AI APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-22.04
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/constraint.txt

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set pip constraint to bypass open_rich_spinner bug
        run: echo "pip<24.0" > ${{ github.workspace }}/constraint.txt

      # ==========================================
      # AUTO-DOWNLOAD FONT STEP
      # ==========================================
      - name: Download Assamese Font
        run: wget -O assamese.ttf https://raw.githubusercontent.com/googlefonts/noto-fonts/main/hinted/ttf/NotoSansBengali/NotoSansBengali-Regular.ttf

      - name: Cache Buildozer files
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-v7-${{ hashFiles('buildozer.spec') }}

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip python3-venv autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Setup Python Environment
        run: |
          python3 -m pip install --upgrade "pip<24.0" setuptools
          python3 -m pip install --upgrade Cython==0.29.33 buildozer

      - name: Inject API Keys into settings
        run: |
          echo 'GEMINI_API_KEYS = ["${{ secrets.GEMINI_API_KEYS }}"]' > config/settings.py
          echo 'GROQ_API_KEYS = ["${{ secrets.GROQ_API_KEYS }}"]' >> config/settings.py
          echo 'OPENROUTER_API_KEYS = ["${{ secrets.OPENROUTER_API_KEYS }}"]' >> config/settings.py
          echo 'MISTRAL_API_KEYS = ["${{ secrets.MISTRAL_API_KEYS }}"]' >> config/settings.py

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AKHIM-AI-APK
          path: bin/*.apk
